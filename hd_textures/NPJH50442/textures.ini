# Mobile Suit Gundam: Path of the Trojan Horse - English patch, HD textures
# For the PPSSPP edition (mokuba_english_ppsspp.patch).
[options]
version = 1
hash = xxh64
ignoreAddress = true
reduceHash = false

# 512-row textures: hash all 512 rows instead of only the rows drawn so far, so each
# texture has one name (address 0 matches any address; needs PPSSPP with PR #23101)
[hashranges]
0,512,512 = 512,512

[hashes]
000000002b4f00c58b8d2fa1 = main_font.png